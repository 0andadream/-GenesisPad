<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Genesis">
  <rect width="64" height="64" rx="10" fill="#f4f4f2"/>
  <!-- Ionic capital mark (simplified column), matches Genesis app logo -->
  <g fill="none" stroke="#171717" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- abacus / capital top -->
    <path d="M16 22h32"/>
    <path d="M18 18h28"/>
    <path d="M20 14h24"/>
    <!-- volute -->
    <path d="M42 22c6 0 10 3.5 10 8.5S48 38 42 38H34"/>
    <path d="M46 26.5c1.8.4 3 1.8 3 3.8 0 2.4-1.8 4.2-4.2 4.2"/>
    <!-- column shaft -->
    <path d="M22 22v28"/>
    <path d="M28 22v28"/>
    <path d="M34 22v28"/>
    <path d="M40 22v16"/>
    <!-- base -->
    <path d="M18 50h28"/>
    <path d="M16 54h32"/>
